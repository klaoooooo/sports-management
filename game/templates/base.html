<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Prompt', 'sans-serif'] },
                colors: {
                    brand: { 500: '#22c55e', 600: '#16a34a' },
                    dark: { bg: '#0f172a', card: '#1e293b', border: '#334155' }
                }
            }}
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<header class="bg-dark-card border-b border-dark-border sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-brand-600 to-emerald-400 p-2.5 rounded-xl">
                    <i class="fa-solid fa-trophy text-xl text-white"></i>
                </div>
                <span class="text-xl font-bold text-white">SPORTS HUB</span>
            </div>
            <nav class="hidden md:flex space-x-1">
                <a href="{% url 'dashboard' %}" class="px-3.5 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'dashboard' %}bg-brand-600 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
                    <i class="fa-solid fa-chart-pie mr-1"></i>ภาพรวม
                </a>
                <a href="{% url 'manage_players' %}" class="px-3.5 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'manage_players' %}bg-brand-600 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
                    <i class="fa-solid fa-users mr-1"></i>นักกีฬา
                </a>
                <a href="{% url 'manage_teams' %}" class="px-3.5 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'manage_teams' %}bg-brand-600 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
                    <i class="fa-solid fa-shield-halved mr-1"></i>ทีม
                </a>
                <a href="{% url 'schedule' %}" class="px-3.5 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'schedule' %}bg-brand-600 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
                    <i class="fa-solid fa-calendar-days mr-1"></i>ตารางแข่ง
                </a>
                <a href="{% url 'standings' %}" class="px-3.5 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'standings' %}bg-brand-600 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
                    <i class="fa-solid fa-list-ol mr-1"></i>ตารางคะแนน
                </a>
            </nav>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    {% block content %}{% endblock %}
</main>

<footer class="bg-dark-card border-t border-dark-border py-6 mt-12 text-center text-xs text-slate-500">
    Sports Management System &copy; 2026
</footer>

<script>
const CSRF = '{{ csrf_token }}';
function api(url, data) {
    return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
        body: JSON.stringify(data)
    }).then(r => r.json());
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
